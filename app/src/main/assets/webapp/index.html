<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Medha · మేధా</title>
<style>
  :root { --indigo:#5B3FA8; --indigo-d:#3B2E7E; --saffron:#F48C2E; --soft:#F3F0FF; --line:#E7E0FA; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,sans-serif; margin:0; background:var(--soft); color:#241261; }
  header { background:linear-gradient(135deg,var(--indigo-d),var(--indigo) 60%,#7C4DBC);
    color:#fff; padding:20px 18px; display:flex; align-items:center; gap:12px; }
  header .flame { width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, #FFD36E, #F48C2E); box-shadow:0 0 18px #f48c2e88; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:2px 0 0; font-size:12px; opacity:.85; }
  main { padding:16px; max-width:640px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .stat { flex:1; min-width:120px; background:var(--soft); border-radius:12px; padding:10px 12px; }
  .stat .k { font-size:11px; color:#7a6fa8; } .stat .v { font-size:18px; font-weight:700; }
  textarea { width:100%; border:1px solid var(--line); border-radius:12px; padding:12px; font-size:15px; resize:vertical; }
  button { background:var(--indigo); color:#fff; border:0; border-radius:12px; padding:12px 18px; font-size:15px; font-weight:600; }
  button.ghost { background:transparent; color:var(--indigo); }
  pre { white-space:pre-wrap; background:var(--soft); border-radius:12px; padding:12px; min-height:48px; margin:10px 0 0; }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .ok{background:#d6f5e0;color:#1b8a3a} .warn{background:#fdeecb;color:#a86b00} .err{background:#f7d6d1;color:#c0392b} .idle{background:#e6e0f5;color:#6a5aa0}
  h3 { margin:0 0 10px; font-size:14px; }
</style>
</head>
<body>
<header>
  <div class="flame"></div>
  <div><h1>Medha · మేధా</h1><p>On-device intelligence, running locally</p></div>
</header>
<main>
  <div class="card">
    <h3>Status <span id="pill" class="pill idle">checking…</span></h3>
    <div class="row">
      <div class="stat"><div class="k">Backend</div><div class="v" id="backend">—</div></div>
      <div class="stat"><div class="k">Memory used</div><div class="v" id="mem">—</div></div>
      <div class="stat"><div class="k">Avg speed</div><div class="v" id="speed">—</div></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="stat"><div class="k">Requests</div><div class="v" id="reqs">0</div></div>
      <div class="stat"><div class="k">Stored chats</div><div class="v" id="chats">0</div></div>
      <div class="stat"><div class="k">Load time</div><div class="v" id="load">—</div></div>
    </div>
    <p id="device" style="font-size:12px;color:#7a6fa8;margin:12px 0 0"></p>
  </div>

  <div class="card">
    <h3>Try it</h3>
    <textarea id="prompt" rows="3">Give me three tips to save money on daily spending.</textarea>
    <div class="row" style="margin-top:10px">
      <button id="send">Generate</button>
      <button id="stream" class="ghost">Stream</button>
    </div>
    <pre id="out"></pre>
  </div>
</main>
<script>
const base = location.origin;
async function j(u){ const r=await fetch(base+u); return r.json(); }
async function refresh(){
  try{
    const h=await j('/health'), s=await j('/system'), m=await j('/metrics');
    const pill=document.getElementById('pill');
    if(h.modelLoaded){pill.className='pill ok';pill.textContent='running';}
    else if(h.error){pill.className='pill err';pill.textContent='load failed';}
    else{pill.className='pill warn';pill.textContent='loading…';}
    document.getElementById('backend').textContent=(s.backendConfigured||'—')+(s.backendVerified?'':' (cfg)');
    document.getElementById('mem').textContent=(s.memUsedMb||0)+'/'+(s.memTotalMb||0)+'MB';
    document.getElementById('speed').textContent=(m.avgTokensPerSec||0).toFixed(1)+' t/s';
    document.getElementById('reqs').textContent=m.totalRequests||0;
    document.getElementById('chats').textContent=m.db_conversations||0;
    document.getElementById('load').textContent=(s.loadMs||0)+'ms';
    document.getElementById('device').textContent=(s.manufacturer||'')+' '+(s.model||'')+' · '+(s.soc||'');
  }catch(e){
    const pill=document.getElementById('pill'); pill.className='pill idle'; pill.textContent='not running';
  }
}
document.getElementById('send').onclick=async()=>{
  const out=document.getElementById('out'); out.textContent='…';
  try{
    const r=await fetch(base+'/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:document.getElementById('prompt').value})});
    const d=await r.json();
    out.textContent=(d.text||JSON.stringify(d))+'\n\n['+d.tokens+' tok · '+d.ms+'ms · '+(d.tokensPerSec||0).toFixed(1)+' t/s]';
  }catch(e){out.textContent='error: '+e;}
};
document.getElementById('stream').onclick=async()=>{
  const out=document.getElementById('out'); out.textContent='';
  try{
    const r=await fetch(base+'/generate/stream',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:document.getElementById('prompt').value})});
    const reader=r.body.getReader(); const dec=new TextDecoder();
    while(true){ const {value,done}=await reader.read(); if(done)break;
      dec.decode(value).split('\n').forEach(line=>{
        if(line.startsWith('data: ')){ const t=line.slice(6); if(t==='[DONE]')return; out.textContent+=t.replace(/\\n/g,'\n'); }
      });
    }
  }catch(e){out.textContent='error: '+e;}
};
refresh(); setInterval(refresh,2500);
</script>
</body>
</html>
