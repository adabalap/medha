# Mirrors the root project's gradle.properties.
#
# android.useAndroidX is not optional despite sounding like a preference: AGP
# hard-fails the build at :app:checkDebugAarMetadata the moment any AndroidX
# artifact appears on the classpath without it, which is every modern Android
# project. Its absence is what broke this sample's first CI run.
#
# nonTransitiveRClass keeps R classes per-module rather than merging every
# dependency's resources into the app's own R, which is the modern default and
# matches how Medha builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
