name: Build Medha APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Secrets are mapped to env at job level: the `secrets` context is not
    # reliably available inside a step-level `if`, but `env` always is. This is
    # what lets forks and secret-less checkouts still produce a debug APK.
    env:
      MEDHA_KEYSTORE_BASE64: ${{ secrets.MEDHA_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Fail fast with an actionable message instead of 200 lines of
      # "Unresolved reference 'room'". This is the exact failure mode that
      # broke v0.1.1: a Room-annotated source file survived the migration to
      # hand-written SQL while the dependency and KSP plugin were gone.
      # ---------------------------------------------------------------
      - name: Guard against orphaned Room sources
        run: |
          set -euo pipefail
          # Comment lines are stripped before matching: app/build.gradle.kts
          # documents how to re-enable Room, and that prose must not read as a
          # live configuration.
          USES_ROOM=$(grep -rlE "^[^/]*(androidx\.room|@Dao|@Entity|RoomDatabase)" \
            --include='*.kt' --include='*.java' app/src || true)
          HAS_DEP=$(grep -rhE "androidx\.room:room-(runtime|compiler|ktx)" \
            app/build.gradle.kts gradle/libs.versions.toml 2>/dev/null \
            | grep -vE '^[[:space:]]*(//|#|\*)' || true)
          HAS_KSP=$(grep -rhE "com\.google\.devtools\.ksp|kotlin-kapt" \
            build.gradle.kts app/build.gradle.kts 2>/dev/null \
            | grep -vE '^[[:space:]]*(//|#|\*)' || true)

          if [ -n "$USES_ROOM" ] && { [ -z "$HAS_DEP" ] || [ -z "$HAS_KSP" ]; }; then
            echo "::error::Room annotations found but Room dependencies and/or KSP are not configured."
            echo "Offending files:"
            echo "$USES_ROOM"
            echo ""
            echo "This project uses hand-written SQL in data/MedhaDatabase.kt and does NOT use Room."
            echo "Either delete the file(s) above, or add room-runtime + room-compiler + the KSP"
            echo "plugin together. See the NOTE ON ROOM block in app/build.gradle.kts."
            exit 1
          fi
          echo "Room guard OK (no orphaned Room sources)."

      # Catches "'onX' hides member of supertype and needs an 'override'
      # modifier" in seconds, and — more importantly — tells you which of the
      # two fixes you actually want. Adding `override` to a click handler that
      # merely happens to be named onStart() compiles, then misfires on every
      # lifecycle transition.
      # kotlinc without android.jar reports thousands of unresolved references,
      # so a genuinely deleted declaration hides in the noise and only breaks on
      # a machine with the real classpath. This finds project symbols that are
      # called but declared nowhere.
      - name: Check for missing declarations
        run: python3 tools/check_symbols.py app/src/main/java

      - name: Check lifecycle overrides
        run: python3 tools/check_overrides.py app/src

      - name: Check resource references
        run: python3 tools/check_resources.py

      # GitHub-hosted runners ship Node.js already; no setup-node step needed.
      # These test the bundled demo webapp's actual shipped JS (markdown
      # rendering, SSE frame parsing), extracted from index.html itself.
      - name: Test demo webapp JS
        run: |
          node tools/tests/webapp_markdown_test.js
          node tools/tests/webapp_sse_test.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The wrapper is committed, so this normally does nothing.
      #
      # The fallback deliberately generates it in an EMPTY temp directory. The
      # previous version ran `gradle wrapper` in the repo root, and the `wrapper`
      # task still has to CONFIGURE the project first -- which means resolving
      # com.android.application with whatever Gradle the runner happens to ship.
      # When that system Gradle disagrees with AGP, the wrapper step explodes
      # with a plugin-resolution error that looks like a build failure but is
      # nothing to do with the build. Generating in an empty dir has no build
      # script to configure, so it cannot fail that way.
      - name: Ensure Gradle wrapper
        run: |
          set -euo pipefail
          if [ -f ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper is committed (good)."
          else
            echo "::warning::Gradle wrapper is missing from the repo; generating a throwaway one."
            echo "Commit gradlew, gradlew.bat and gradle/wrapper/gradle-wrapper.jar to pin the build tool."
            TMP="$(mktemp -d)"
            ( cd "$TMP" && gradle wrapper --gradle-version 8.9 -q )
            mkdir -p gradle/wrapper
            cp "$TMP/gradlew" "$TMP/gradlew.bat" ./
            cp "$TMP/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            [ -f gradle/wrapper/gradle-wrapper.properties ] \
              || cp "$TMP/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
            rm -rf "$TMP"
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Read version name
        id: ver
        run: |
          V=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Decode release keystore
        id: signing
        if: env.MEDHA_KEYSTORE_BASE64 != ''
        run: |
          echo "$MEDHA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/medha.jks"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleCoreDebug assembleFullDebug --stacktrace --no-daemon

      - name: Build release APK
        if: steps.signing.outputs.available == 'true'
        env:
          MEDHA_KEYSTORE_PATH: ${{ runner.temp }}/medha.jks
          MEDHA_KEYSTORE_PASSWORD: ${{ secrets.MEDHA_KEYSTORE_PASSWORD }}
          MEDHA_KEY_ALIAS: ${{ secrets.MEDHA_KEY_ALIAS }}
          MEDHA_KEY_PASSWORD: ${{ secrets.MEDHA_KEY_PASSWORD }}
        run: ./gradlew assembleCoreRelease assembleFullRelease --stacktrace --no-daemon

      # AGP always writes app-<buildType>.apk. Renaming here rather than via the
      # Variant API keeps the build script free of AGP-version-specific plumbing.
      - name: Name the APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          V="${{ steps.ver.outputs.version }}"
          SHA=$(git rev-parse --short HEAD)
          # Flavour builds land in apk/<flavour>/<buildType>/.
          for FLAV in core full; do
            for BT in debug release; do
              APK=$(ls app/build/outputs/apk/$FLAV/$BT/*.apk 2>/dev/null | head -1 || true)
              [ -n "$APK" ] && cp "$APK" "dist/medha-$V-$FLAV-$BT-$SHA.apk"
            done
          done
          ls -la dist/

      - name: Lint
        continue-on-error: true
        run: ./gradlew lintCoreDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: medha-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-coreDebug.html
          if-no-files-found: ignore

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
